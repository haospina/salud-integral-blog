# _config.yml - Blog Educativo de Medicina
title: "Salud Integral - Educación Médica"
description: "Espacio educativo para estudiantes de medicina integrando ciencias básicas, clínicas, salud mental y salud pública"
baseurl: ""
url: "https://salud-integral.www-haosp.org"

# Tema educativo profesional
remote_theme: pmarsceill/just-the-docs

# Configuración del tema
just_the_docs:
  search_enabled: true
  heading_anchors: true
  color_scheme: "light"
  # No definimos 'nav:' porque la navegación se construye automáticamente
  # a partir de los front matter de cada archivo .md

# Autor y configuración institucional
author:
  name: "Héctor Augusto Ospina Angarita"
  email: "educacion@salud-integral.www-haosp.org"
  twitter: "SaludIntegralMed"

institution:
  name: "Programa de Medicina"
  department: "Ciencias Clínicas"
  university: "Universidad del Tolima"

# Configuración build
markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendorgit