# _config.yml - Blog Educativo de Medicina
title: "Salud Integral - Educación Médica"
description: "Espacio educativo para estudiantes de medicina integrando ciencias básicas, clínicas, salud mental y salud pública"
baseurl: ""
url: "https://salud-integral.www-haosp.org"

# Tema educativo profesional
remote_theme: pmarsceill/just-the-docs

# Configuración del tema
just_the_docs:
  search_enabled: true
  heading_anchors: true
  color_scheme: "light"
  
  # Navegación estructurada
  nav:
    - title: "Inicio"
      url: /
      
    - title: "👨‍⚕️ Ciencias Básicas"
      url: /categorias/basicas/
      children:
        - title: "Anatomía y Fisiología"
          url: /categorias/basicas/anatomia-fisiologia/
        - title: "Bioquímica y Biología Molecular"
          url: /categorias/basicas/bioquimica/  
        - title: "Microbiología y Patología"
          url: /categorias/basicas/microbiologia-patologia/  
    
    - title: "🏥 Ciencias Clínicas"
      url: /categorias/clinicas/
      children:
        - title: "Semiología y Diagnóstico"
          url: /categorias/clinicas/semiologia/ 
        - title: "Medicina Interna"
          url: /categorias/clinicas/medicina-interna/
        - title: "Especialidades"
          url: /categorias/clinicas/especialidades/
    
    - title: "🧠 Salud Mental"
      url: /categorias/salud-mental/
      children:
        - title: "Psicología Médica"
          url: /categorias/salud-mental/psicologia-medica/
        - title: "Psiquiatría Clínica"
          url: /categorias/salud-mental/psiquiatria/
        - title: "Neurociencias"
          url: /categorias/salud-mental/neurociencias/
    
    - title: "🌍 Salud Pública"
      url: /categorias/salud-publica/
      children:
        - title: "Epidemiología"
          url: /categorias/salud-publica/epidemiologia/
        - title: "Medicina Social"
          url: /categorias/salud-publica/medicina-social/
        - title: "Salud Comunitaria"
          url: /categorias/salud-publica/salud-comunitaria/ 
    
    - title: "📚 Recursos"
      url: /recursos/
      children:
        - title: "Guías de Publicación"
          url: /recursos/guias-publicacion/
        - title: "Formatos Casos Clínicos"
          url: /recursos/formatos-casos/
        - title: "Plantillas Investigación"
          url: /recursos/plantillas-investigacion/
    
    - title: "👥 Para Estudiantes"
      url: /estudiantes/
      children:
        - title: "Cómo Publicar"
          url: /estudiantes/como-publicar/
        - title: "Criterios de Evaluación"
          url: /estudiantes/criterios-evaluacion/
    
    - title: "👨‍🏫 Para Profesores"
      url: /profesores/
      children:
        - title: "Guía de Tutores"
          url: /profesores/guia-tutores/
        - title: "Rúbricas de Evaluación"
          url: /profesores/rubricas/

# Autor y configuración institucional
author:
  name: "Héctor Augusto Ospina Angarita"
  email: "educacion@salud-integral.www-haosp.org"
  twitter: "SaludIntegralMed"

institution:
  name: "Programa de Medicina"
  department: "Ciencias Clinicas"
  university: "Universidad del Tolima"

# Configuración build
markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendorgit